name: build
run-name: Build Discordio
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.4.0'

      # Every CI build gets a build number. The plugin's in-Game-Mode updater
      # compares it against the newest GitHub release.
      - name: Stamp version
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          VERSION="$BASE-build.${{ github.run_number }}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build frontend
        run: |
          pnpm i --frozen-lockfile
          pnpm run build

      - name: Check Python and injected JS
        run: |
          python3 -m py_compile main.py defaults/*.py defaults/*/*.py
          node --check defaults/deckcord_client.js
          node --check defaults/webrtc_client.js

      - name: Download Decky Plugin CLI
        run: |
          mkdir $(pwd)/cli
          curl -L -o $(pwd)/cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/latest/download/decky-linux-x86_64"
          chmod +x $(pwd)/cli/decky

      # The Decky CLI also builds backend/ in Docker, which bundles the
      # GStreamer libraries Go Live needs into bin/.
      - name: Build plugin
        run: |
          $(pwd)/cli/decky plugin build $(pwd)
          unzip out/*.zip -d out/unzipped

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Discordio
          path: out/unzipped/*

      - name: Publish build as a pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(ls out/*.zip | head -1)
          cp "$ZIP" out/Discordio.zip 2>/dev/null || true
          gh release create "build-${{ github.run_number }}" out/Discordio.zip scripts/discordio-test.sh \
            --prerelease \
            --title "Build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)" \
            --target "${{ github.sha }}"
